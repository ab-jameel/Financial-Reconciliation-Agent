# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon_dev_only
          POSTGRES_DB: reconciliation
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U recon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://recon:recon_dev_only@localhost:5432/reconciliation
          POSTGRES_CHECKPOINT_URI: postgresql://recon:recon_dev_only@localhost:5432/reconciliation
        run: uv run pytest -v --timeout=120

      - name: Load policy corpus into Qdrant
        run: uv run python data/load_policies_to_qdrant.py