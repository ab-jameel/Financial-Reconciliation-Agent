[project]
name = "recon-common"
version = "0.1.0"
description = "Shared models: Transaction, LedgerEntry, Invoice, Match, Exception"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_common"]