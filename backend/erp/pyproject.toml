[project]
name = "recon-erp"
version = "0.1.0"
description = "Mock ERP: journal entries, token verification, hash-chained audit log. Its own process."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "recon-common",
    "pyjwt[crypto]>=2.8",
    "python-dotenv>=1.0",
]

[tool.uv.sources]
recon-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_erp"]