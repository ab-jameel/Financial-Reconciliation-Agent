[project]
name = "recon-orchestration"
version = "0.1.0"
description = "LangGraph orchestration: matcher, investigator, human review. Calls the ERP only over HTTP."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "qdrant-client>=1.10",
    "langsmith>=0.1",
    "litellm>=1.44",
    "httpx>=0.27",
    "recon-common",
    "fastembed>=0.3",
    "rapidfuzz>=3.9",
    "psycopg2-binary>=2.9.12",
]

[tool.uv.sources]
recon-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_orchestration"]
